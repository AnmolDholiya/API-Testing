services:
  # ── 1. MongoDB Database Service ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. Express.js Backend API Service ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=adwf_jwt_secret_key_practical_7_2026
      - JWT_EXPIRES_IN=1h
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # ── 3. React + Vite Frontend Service (Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# ── Docker Bridge Network ─────────────────────────────────────────────────────
networks:
  app-network:
    name: app-network
    driver: bridge

# ── Persistent Storage Volume ─────────────────────────────────────────────────
volumes:
  mongodb_data:
    name: mongodb_data
